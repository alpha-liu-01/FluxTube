name: Desktop Draft Release

on:
  release:
    types:
      - created
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux x64 archive
    # A draft created by this workflow fires release.created as github-actions.
    # Skip that run so it does not build the same archives twice.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux desktop packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            cmake \
            curl \
            git \
            libgtk-3-dev \
            liblzma-dev \
            libmpv-dev \
            make \
            ninja-build \
            openjdk-17-jdk-headless \
            pkg-config \
            unzip \
            xz-utils \
            zip

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.1"
          cache: true

      - name: Analyze
        run: |
          flutter pub get
          flutter analyze

      - name: Build Linux archive
        run: packaging/linux/build-release.sh

      - name: Upload Linux archive
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist/fluxtube-*-linux-x64.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build Windows x64 installer
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.1"
          cache: true

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          flutter config --no-analytics --enable-windows-desktop
          flutter pub get
          flutter build windows --release
          bash packaging/java/bundle-runtime.sh "build/windows/x64/runner/Release"
          bash packaging/ffmpeg/bundle-ffmpeg.sh "build/windows/x64/runner/Release"
          $version = "${{ steps.app_version.outputs.version }}"
          $numeric = $version -replace '\+', '.'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$version" `
            "/DVersionInfo=$numeric" `
            "packaging\windows\fluxtube.iss"
          Get-Item "dist/fluxtube-$version-windows-x64.exe" | Format-List FullName, Length

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/fluxtube-*-windows-x64.exe
          if-no-files-found: error

  release:
    name: Publish desktop files
    needs:
      - build-linux
      - build-windows
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          pattern: "*-x64"
          path: dist
          merge-multiple: true

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          tag="v${version//+/-}-desktop-run-${GITHUB_RUN_NUMBER}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          ls -lah dist

      - name: Collect release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find dist -type f \( -name '*.exe' -o -name '*.tar.gz' \) -exec cp -t release-assets {} +
          if find release-assets -type f -name '*.zip' | grep -q .; then
            echo "Refusing to publish a zip. The Windows asset must be the installer exe." >&2
            exit 1
          fi
          if ! find release-assets -type f -name '*.exe' | grep -q .; then
            echo "Windows installer exe is missing." >&2
            exit 1
          fi
          ls -lah release-assets

      - name: Create release notes
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "Automated desktop build for ${GITHUB_SHA}."
            echo
            echo "Included files:"
            find release-assets -maxdepth 1 -type f -printf '- %f\n' | sort
            echo
            echo "The Linux archive and the Windows installer both include a headless Java 17 runtime, newpipe-spike.jar, and a static ffmpeg."
            echo "The Windows file is the Inno Setup installer (.exe), not a zip of that installer. The Linux archive needs libmpv installed at runtime."
            echo
            echo "Recent changes:"
            git log --pretty='- %s (%h)' -20
          } > RELEASE_NOTES.md

      - name: Create draft GitHub Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.app_version.outputs.tag }}" release-assets/* \
            --draft \
            --title "FluxTube ${{ steps.app_version.outputs.version }} desktop" \
            --notes-file RELEASE_NOTES.md

      - name: Upload files to the new release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${{ github.event.release.tag_name }}" release-assets/* --clobber
